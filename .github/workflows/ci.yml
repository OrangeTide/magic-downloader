name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Tags so `git describe` sets the version.

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc fp-units-fcl fp-units-db fpc-source

      - name: Build
        run: make

      - name: Build man page
        run: make man
